name: Modernization tooling

on: [push, pull_request]

permissions:
  contents: read

jobs:
  native-library:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - run: >-
          apt-get update && apt-get install -y
          git ca-certificates curl build-essential autoconf automake pkg-config
          flex bison python3-dev samba-dev libmariadb-dev-compat
          libmemcached-dev libnanomsg-dev libpopt-dev libparse-yapp-perl
          check libsubunit-dev
      - uses: actions/checkout@v4
      - name: Fetch matching-generation PIDL source
        run: |
          curl --fail --location --retry 3 --output /tmp/samba.tar.gz https://download.samba.org/pub/samba/stable/samba-4.22.10.tar.gz
          printf '%s  %s\n' e601437cde4845a42e7818379cd0ad5fc4fa518a7cf5284cc0a2657e79b30c34 /tmp/samba.tar.gz | sha256sum --check
          tar -xzf /tmp/samba.tar.gz -C /tmp samba-4.22.10/pidl
          echo /tmp/samba-4.22.10/pidl >> "$GITHUB_PATH"
          echo PERL5LIB=/tmp/samba-4.22.10/pidl/lib >> "$GITHUB_ENV"
      - run: ./autogen.sh && ./configure --with-samba=/usr --prefix="$RUNNER_TEMP/openchange"
      - name: Build every default target from source
        run: make -j2 all
      - name: Run client tests without a server
        run: |
          make mapitest-install
          LD_LIBRARY_PATH=.:mapiproxy ./bin/mapiprofile --newdb --database "$RUNNER_TEMP/profiles.ldb" --ldif setup/profiles
          LD_LIBRARY_PATH=.:mapiproxy ./bin/mapitest --no-server --database "$RUNNER_TEMP/profiles.ldb"
      - run: make check-propsdump
      - name: Check capture reader with sanitizers
        run: make -W testsuite/modernization/propsdump_smoke.c check-propsdump CC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
      - run: make check-libmapi-modernization
      - name: Check the custom NDR parser with sanitizers
        run: make -W ndr_mapi.c -W testsuite/modernization/ndr_smoke.c check-ndr-modernization CC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Restore the native NDR library
        run: make -W ndr_mapi.c -W testsuite/modernization/ndr_smoke.c check-ndr-modernization
      - run: make check-mapiadmin
      - name: Check administration failures with sanitizers
        run: make -W testsuite/modernization/admin_smoke.c -W testsuite/modernization/admin_crypto_smoke.c check-mapiadmin CC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Load administration library
        run: LD_LIBRARY_PATH=. python3 -c 'import ctypes; ctypes.CDLL("./libmapiadmin.so.0")'
      - run: make check-ocpf-lexer
      - name: Check OCPF strings with sanitizers
        run: make -W testsuite/modernization/ocpf_lexer_smoke.c check-ocpf-lexer CC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
      - run: make check-mapiproxy-registries
      - run: make check-mapiproxy-rpc
      - run: make check-asyncemsmdb
      - run: make check-nspi
      - run: make check-emsmdb
      - run: make mapiproxy
      - run: make check-mpm-pack
      - run: make check-mpm-cache
      - name: Check default server boundaries with sanitizers
        run: make -W testsuite/modernization/nspi_smoke.c -W testsuite/modernization/nspi_backend_smoke.c -W testsuite/modernization/emsmdb_smoke.c -W testsuite/modernization/emsmdb_backend_smoke.c check-nspi check-emsmdb CC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Load the default servers
        run: LD_LIBRARY_PATH=.:mapiproxy python3 -c 'import ctypes; [ctypes.CDLL("./mapiproxy/servers/" + name + ".so") for name in ("exchange_nsp", "exchange_emsmdb", "exchange_ds_rfr")]'
      - name: Check cache files and sync command with sanitizers
        run: make -W testsuite/modernization/cache_smoke.c check-mpm-cache CC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Check pack parser memory handling with sanitizers
        run: make -W testsuite/modernization/pack_smoke.c check-mpm-pack CC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Load the asynchronous RPC module
        run: LD_LIBRARY_PATH=.:mapiproxy python3 -c 'import ctypes; ctypes.CDLL("./mapiproxy/dcesrv_asyncemsmdb.so")'
      - name: Check asynchronous RPC lifecycle with sanitizers
        run: make -W testsuite/modernization/asyncemsmdb_smoke.c check-asyncemsmdb CC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Check RPC module with UndefinedBehaviorSanitizer
        run: make -W mapiproxy/dcesrv_mapiproxy.c -W mapiproxy/dcesrv_mapiproxy_nspi.c -W testsuite/modernization/rpc_smoke.c check-mapiproxy-rpc CC='gcc -fsanitize=undefined -fno-omit-frame-pointer'
      - name: Check registry memory handling with sanitizers
        run: make -W testsuite/modernization/registry_smoke.c check-mapiproxy-registries CC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
      - run: python3 -c 'import ctypes; ctypes.CDLL("./libmapi.so.2.3")'
      - run: make -q libmapi

  tooling:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake pkg-config build-essential
      - run: python3 -m unittest discover -s testsuite/modernization -v
      - run: python3 script/doctor.py --json

  python-runtime:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: openchange-ci-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-samba python3-mysqldb perl
      - run: libmapi/conf/mparse.pl --parser=mapistore_namedprops_python --outputdir=python/openchange/migration/ libmapi/conf/mapi-named-properties
      # Use the distribution interpreter to match Samba's compiled bindings.
      - run: /usr/bin/python3 -m unittest discover -s python/openchange/tests -v
        env:
          PYTHONPATH: python
          OPENCHANGE_TEST_MYSQL_HOST: 127.0.0.1
          OPENCHANGE_TEST_MYSQL_PORT: ${{ job.services.mariadb.ports[3306] }}
          OPENCHANGE_TEST_MYSQL_PASSWORD: openchange-ci-only
